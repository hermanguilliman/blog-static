<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Как писать техдокументацию, чтобы через год всё ещё понимать">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.96" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)" />

  <g opacity="0.10">
    <circle cx="1030" cy="80" r="110" fill="#a5f3fc" />
    <circle cx="160" cy="340" r="125" fill="#bfdbfe" />
  </g>

  <g>
    <text x="80" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#bfdbfe">Практика документации</text>
    <text x="80" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#f8fafc">Как писать</text>
    <text x="80" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#f8fafc">техдокументацию,</text>
    <text x="80" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#f8fafc">чтобы через год</text>
    <text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#f8fafc">её ещё понять</text>
    <text x="80" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#dbeafe">Цель, шаги, проверка, откат</text>
  </g>

  <g>
    <rect x="760" y="85" width="360" height="250" rx="20" fill="url(#card)" />
    <text x="790" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">docs/runbook.md</text>
    <rect x="790" y="145" width="300" height="12" rx="6" fill="#cbd5e1" />
    <rect x="790" y="172" width="260" height="12" rx="6" fill="#cbd5e1" />
    <rect x="790" y="199" width="280" height="12" rx="6" fill="#cbd5e1" />
    <rect x="790" y="226" width="220" height="12" rx="6" fill="#cbd5e1" />
    <rect x="790" y="253" width="290" height="12" rx="6" fill="#cbd5e1" />
    <rect x="790" y="280" width="240" height="12" rx="6" fill="#cbd5e1" />
    <text x="790" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Проверенные шаги</text>
  </g>
