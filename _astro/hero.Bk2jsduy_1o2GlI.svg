<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Недорогие микроконтроллеры для DIY">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)" />

  <g opacity="0.15">
    <circle cx="1040" cy="80" r="120" fill="#93c5fd" />
    <circle cx="170" cy="340" r="130" fill="#67e8f9" />
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="125" width="250" height="170" rx="18" fill="url(#chip)" />
    <g stroke="#334155" stroke-width="4" stroke-linecap="round">
      <line x1="745" y1="145" x2="780" y2="145" />
      <line x1="745" y1="175" x2="780" y2="175" />
      <line x1="745" y1="205" x2="780" y2="205" />
      <line x1="745" y1="235" x2="780" y2="235" />
      <line x1="745" y1="265" x2="780" y2="265" />
      <line x1="1030" y1="145" x2="1065" y2="145" />
      <line x1="1030" y1="175" x2="1065" y2="175" />
      <line x1="1030" y1="205" x2="1065" y2="205" />
      <line x1="1030" y1="235" x2="1065" y2="235" />
      <line x1="1030" y1="265" x2="1065" y2="265" />
    </g>
    <text x="905" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">MCU</text>
    <text x="905" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#334155">DIY 2026</text>
  </g>

  <text x="90" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc">Недорогие</text>
  <text x="90" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc">микроконтроллеры</text>
  <text x="90" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#f8fafc">для DIY-устройств</text>
  <text x="90" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#dbeafe">Сравнение, выбор, советы и готовые рекомендации</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e2e8f0">
    <text x="90" y="372">RP2040 · ESP32-C3 · STM32G0 · CH32V003 · ATmega328P</text>
  </g>
</svg>
