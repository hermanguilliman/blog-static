<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Как выбрать микроконтроллер">
  <rect width="1200" height="520" rx="24" fill="#f8fafc" />
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Быстрый выбор микроконтроллера</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="410" y="70" width="380" height="54" rx="16" fill="#1d4ed8" />
    <text x="600" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Какая главная задача?</text>

    <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
        </marker>
      </defs>
      <path d="M510,124 C430,160 320,180 250,210" />
      <path d="M600,124 L600,200" />
      <path d="M690,124 C770,160 880,180 950,210" />
    </g>

    <g>
      <rect x="90" y="205" width="290" height="62" rx="16" fill="#dbeafe" stroke="#2563eb" />
      <text x="235" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Беспроводная связь</text>
      <text x="235" y="256" text-anchor="middle" font-size="15" fill="#334155">Wi-Fi / BLE → ESP32-C3 / ESP32-S3</text>
    </g>

    <g>
      <rect x="455" y="205" width="290" height="62" rx="16" fill="#dbeafe" stroke="#2563eb" />
      <text x="600" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Точное управление</text>
      <text x="600" y="256" text-anchor="middle" font-size="15" fill="#334155">Моторы, PWM → RP2040 / STM32</text>
    </g>

    <g>
      <rect x="820" y="205" width="290" height="62" rx="16" fill="#dbeafe" stroke="#2563eb" />
      <text x="965" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Максимальная дешевизна</text>
      <text x="965" y="256" text-anchor="middle" font-size="15" fill="#334155">Простая логика → CH32V003 / ATtiny</text>
    </g>

    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow2)">
      <defs>
        <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
        </marker>
      </defs>
      <path d="M235,267 L235,315" />
      <path d="M600,267 L600,315" />
      <path d="M965,267 L965,315" />
    </g>

    <g>
      <rect x="130" y="315" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" />
      <text x="235" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ESP32-C3</text>
      <text x="235" y="365" text-anchor="middle" font-size="13" fill="#475569">Дешёвый IoT/MCU</text>
      <text x="235" y="383" text-anchor="middle" font-size="13" fill="#475569">Wi-Fi + BLE</text>
    </g>

    <g>
      <rect x="495" y="315" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" />
      <text x="600" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">RP2040 / RP2350</text>
      <text x="600" y="365" text-anchor="middle" font-size="13" fill="#475569">Много GPIO и PIO</text>
      <text x="600" y="383" text-anchor="middle" font-size="13" fill="#475569">MicroPython/C++</text>
    </g>

    <g>
      <rect x="860" y="315" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" />
      <text x="965" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CH32V003</text>
      <text x="965" y="365" text-anchor="middle" font-size="13" fill="#475569">Копеечный контроллер</text>
      <text x="965" y="383" text-anchor="middle" font-size="13" fill="#475569">Для простых схем</text>
    </g>

    <text x="600" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">
      Сложные проекты часто комбинируют: ESP32 как «мозг с Wi-Fi» + специализированная периферия.
    </text>
  </g>
</svg>
